<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APT Calgary delivery zones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E9EEF6; --ink: #16213E; --muted: #55607A; --accent: #D7263D;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0F1626; --ink: #E9EEF6; --muted: #9AA6BF; --accent: #FF5C6E; }
  }
  :root[data-theme="dark"] { --bg: #0F1626; --ink: #E9EEF6; --muted: #9AA6BF; --accent: #FF5C6E; }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 1.0625rem; line-height: 1.5;
  }
  main { max-width: 60rem; margin: 0 auto; padding: clamp(1.5rem, 5vw, 4rem) clamp(1.25rem, 5vw, 3rem); }
  .brand { font-weight: 800; font-size: 1.125rem; letter-spacing: -0.01em; margin: 0 0 clamp(2rem, 6vh, 3.5rem); }
  h1 { font-weight: 800; font-size: clamp(2rem, 5vw, 3.25rem); letter-spacing: -0.03em; line-height: 1.05; margin: 0 0 0.75rem; }
  .intro { color: var(--muted); margin: 0 0 1.5rem; max-width: 52ch; }
  .map {
    position: relative; width: 100%; aspect-ratio: 16 / 10; max-height: 78vh;
    border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; background: var(--bg);
  }
  .map iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .map-link { margin: 0.75rem 0 0; }
  .map-link a { color: var(--ink); font-weight: 600; }
  .map-link a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 30rem) {
    .map { aspect-ratio: 4 / 5; }
  }
</style>
</head>
<body>
<main>
  <p class="brand">APT Calgary</p>
  <h1>Delivery zones</h1>
  <p class="intro">Tap a zone on the map to see its delivery days, order cut-off and delivery window.</p>
  <div class="map">
    <iframe src="https://www.google.com/maps/d/embed?mid=1FAuNNzZ-qkC9PRoSXejRBYLP9yiGwJs&amp;ehbc=2E312F" title="APT Calgary delivery zones map" allowfullscreen></iframe>
  </div>
  <p class="map-link"><a href="https://www.google.com/maps/d/viewer?mid=1FAuNNzZ-qkC9PRoSXejRBYLP9yiGwJs" target="_blank" rel="noopener">Open the map full screen</a></p>
</main>
</body>
</html>
